desc: Introduces PSTO, a convection-diffusion surrogate that applies one learned transport
  block for a fixed number of relaxed fixed-point iterations to approximate an implicit
  update; four iterations cut one-step error 5.8x versus one, and 100-step rollout
  error falls at least 50% below the best neural baseline.
