desc: "Uses graph walks to show that the loops of a looped Transformer need not repeat one fixed step: a learned linear map on the hidden state entering a frozen loop selects which transition the shared layers perform, activation patching traces this control to attention routing, and the intermediate supervision used in backbone training determines which transitions can be selected."
