desc: Isolates recurrence placement, input injection and recurrent-state design in
  looped LMs at matched scale, favoring a Huginn-style prelude-core-coda sandwich
  with input injection; at 730M parameters and 336B tokens it beats Ouro on all ten
  benchmarks, and the advantage carries to 8B-A0.8B MoE models.
