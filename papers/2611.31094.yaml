desc: Introduces LoopRes, which retrofits pretrained LLMs into looped models whose
  layers attend over earlier loop outputs through trainable loop-aware keys, improving
  Qwen3-1.7B-Base by 29.1% over SFT at 2× compute vs 13.9% for the best prior looping
  method.
