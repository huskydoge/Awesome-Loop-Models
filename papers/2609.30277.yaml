desc: Introduces SheafDEQ, a subhomogeneous deep-equilibrium graph network whose node
  states are fixed points of learned, edge-dependent neural-sheaf message passing,
  with a proof of a unique globally attracting equilibrium reachable by fixed-point
  iteration and gains over fixed-propagation implicit GNN baselines on long-range
  and heterophilic tasks.
