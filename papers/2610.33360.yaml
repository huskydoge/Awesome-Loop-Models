desc: "Adds an LSTM-style gated carry across iterations of a looped transformer core and shares one donor key-value cache across all core blocks; it uses 40.4% fewer parameters than an untied control at near-matched FLOPs, and a late consistency loss removes 81-89% of the shared-cache continuation penalty."
