desc: 'Shows that quantizing weight-tied recursive reasoning models accumulates error at every step: per-tensor 4-bit activations drop Sudoku exact accuracy from 84.1% to 0%, while block-wise scaling such as MXInt4 restores it, with deeper recursion being more quantization-sensitive.'
