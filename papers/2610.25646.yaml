desc: Runs a weight-tied normalized-Transformer block as a damped fixed-point solver
  on the unit hypersphere with geodesic injection, slerp damping and angular halting,
  proves convergence conditions, and reaches 96.6% on Sudoku-Extreme, 87.9% on Maze-Hard
  and 59.1% on Mini-ARC.
