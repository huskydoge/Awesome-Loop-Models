desc: Introduces RecurrentVLM, which makes each attention layer of Qwen3.5-4B recompute
  the keys and values of finished frame groups from its own output so its state updates
  once per frame group; it reaches 99.6% on MET-Bench and 99% on 50-swap shell games
  after training on at most 30 swaps.
