desc: Compares a 12-layer stack looped four times with standard Transformers under a 100M-word BabyLM budget; the loop beats a compute-matched 48-layer model by 5.4 BLiMP points in text-only training but does not reduce the roughly 3.8-point drop from multimodal training.
