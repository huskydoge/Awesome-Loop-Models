desc: Compares weight-tied looped and depth-grown language models up to 3B with dense
  models of matched inference FLOPs and effective depth, finding that both learn in-context
  earlier, keep that ability longer and lean more on induction heads, though the 3B
  looped model trails dense on nine-task MC (60.53 vs 61.33).
