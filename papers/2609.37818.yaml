desc: Introduces LoopSLM, a spoken language model that reuses a decoder block for
  latent reasoning with acoustic grounding at every pass and a two-stage training
  recipe; on EchoMind it improves paralinguistic reasoning by over 20 points versus
  CoT fine-tuning while generating 64.5% fewer tokens at half the latency.
