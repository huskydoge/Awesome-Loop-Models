desc: Introduces LoopSight, a looped ViT whose Gated Prediction Memory keeps a gated
  readout state separate from the shared core's evolving computation, reaching 67.4%
  pass@2 on ARC-AGI-1 (+6.6 over LoopViT at comparable size) and staying stable out
  to 24 loops.
