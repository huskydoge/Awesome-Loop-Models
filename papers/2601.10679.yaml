desc: 'Mechanistic study of the Hierarchical Reasoning Model showing it can fail on near-trivial Sudoku puzzles because the fixed-point assumption is violated, that answers improve abruptly at a critical step, and that it often settles on an incorrect fixed point first, i.e. it guesses.'
