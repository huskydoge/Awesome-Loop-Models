desc: Presents CHARM, a compact ARC model that pairs a recurrent reasoning backbone
  with a compositional sparse task embedding (CoSE) that cuts learned task-memory
  parameters by over 90 percent, finds that recurrent depth helps only when balanced
  with learning horizon, and reports 84 percent pass@2 on ARC-AGI-1 and 46.7 percent
  on ARC-AGI-2 public evaluation.
