desc: Loops each reader layer of a causal encoder-decoder independently while publishing
  each token's local KV entry only on its first visit, so one 204M checkpoint serves
  3-21 layer calls at a fixed cache size and beats a single-pass model by 0.020 nats
  test cross-entropy at 21 calls.
