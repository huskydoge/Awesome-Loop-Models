desc: Profiles quantization damage for every (loop, layer) cell of Ouro and plans
  4-bit, 2-bit or final-loop KV reuse per cell, run by one fused vLLM kernel; on Ouro-1.4B
  it stores 35% less KV than uniform 4-bit KIVI and sustains 1.7-2.2x its goodput
  under a latency target.
