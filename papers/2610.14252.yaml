desc: Introduces fixed-first training for prelude-core-coda looped transformers, holding
  loop depth fixed for most of training and sampling depths uniformly only in a short
  final phase, cutting modeled training compute by 31-45 percent at 200M parameters
  while keeping mean NLL across inference depths within 0.5 percent.
