desc: Introduces LoopLook, which re-applies a middle-to-late window of a pretrained
  VLM vision encoder with shared weights, question-conditioned modulation, a learned
  exit head and token-wise fusion of loop states; on Qwen2.5-VL-3B it lifts MMStar
  from 55.9 to 64.5 at 5.1-6.5% extra time to first token.
