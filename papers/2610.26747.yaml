desc: Pretrains recAMPLIFY, a masked protein language model whose weight-tied Transformer
  core refines residue states over adjustable cycles; with 155M unique parameters
  on 2T tokens it beats AMPLIFY-350M on fold accuracy (0.696 vs 0.568), and Gated
  Mixture Recurrence halting cuts expected cycles by 32 to 40%.
