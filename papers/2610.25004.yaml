desc: Upcycles a pretrained LLM by looping each selected middle layer locally and
  gating the attention and MLP residual writes of later loops per layer and loop;
  from Qwen3-4B Base with SFT, the 20-benchmark average rises from 51.90 (non-looped)
  to 58.07 at three loops, past the usual two-loop saturation.
