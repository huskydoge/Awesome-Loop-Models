desc: Compares HRM, TRM and URM-style recursive reasoners under one pipeline across
  six algorithmic domains and finds that an intermediate gradient horizon, large physical
  batches and bounded, gated recurrent-state updates matter more than an explicit
  hierarchy; the resulting 13.6M-parameter shared-block model reaches 71.2 percent
  Arithmetic OOD accuracy versus 36.2 percent for the strongest baseline, 98.41 percent
  on Sudoku and 59.5 percent pass@2 on ARC-AGI-1.
