desc: Introduces LoopCache, a lossless self-speculative decoder for looped Transformers that updates drafts from every intermediate loop and cycles through loop-specific KV caches so each step reads one loop's cache, averaging 10.25x and 14.56x speedups over WaveFront Decoding and LoopSpec on 4K-128K contexts.
