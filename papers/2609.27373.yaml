desc: Finds that attention support in recurrent-depth language models stabilizes earlier
  than hidden states and introduces WISE, a training-free method that uses global
  attention in early recurrent steps and reuses the discovered sparse working set
  later, reaching up to 1.76 times attention speedup at 4K context.
