desc: Tests loops that re-apply a span of a trained model's layers against an identically
  trained unlooped twin and an equal-FLOP baseline; across Qwen3 and Qwen3.5 models from
  0.8B to 9B only the 0.8B loop beats its twin (48.3% vs 44.2%), while looping slows decoding
  1.2-1.3x.
