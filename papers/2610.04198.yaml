desc: 'Adds an inner loop to each denoising step of a diffusion language model: a
  shared recurrent core of Transformer layers is reapplied while confident tokens
  commit as discrete context and unresolved tokens keep refining their latent states,
  with a learned exit gate trained through a conditional ELBO over token-wise exit
  schedules; converted from Qwen3 by SFT on 5B tokens, ALoDLM averages 65.5 and 80.3
  over eleven benchmarks at 1.7B and 8B, above all evaluated diffusion LMs and the
  Qwen3 AR baselines.'
