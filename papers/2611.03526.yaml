desc: Replaces a fixed layer stack with a learned router that picks which block from
  a shared library to apply at each routed depth, so blocks can repeat; it matches
  parameter-matched Huginn looped models in loss and stays within 2 standard errors
  of FLOPs-matched dense 1B models on five benchmarks.
