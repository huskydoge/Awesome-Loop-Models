desc: Introduces LatentLoop, a looped MoE whose middle block runs its first visit
  on a 2x-compressed sequence and its second at full resolution with shared experts
  and per-visit attention, achieving the lowest validation loss at all 15 matched
  budgets from 1.3B to 7B parameters.
