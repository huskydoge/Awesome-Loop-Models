desc: Introduces AIC, an RL policy that refines its latent state with one weight-shared residual MLP and learns from the return when to halt; capped at eight steps, it averages 3.3 steps over twelve tasks and cuts per-decision latency by 31-44% versus a fixed eight-step policy on four control tasks.
