desc: Loops a two-block slice of a 170M uniform-diffusion denoiser inside each denoising step with random loop counts in training, matching a non-looped model's validation NLL with up to 2.8x (OpenWebText) and 3.3x (FineWeb-Edu) fewer training FLOPs and up to 9.8% lower generative perplexity at matched NFE.
