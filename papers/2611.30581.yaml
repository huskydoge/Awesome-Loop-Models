desc: Introduces Loop-PP, a pipeline-parallel training system that schedules repeated
  cross-stage visits of a shared layer stack in interleaved 1F1B without duplicating
  weights, cutting peak memory by up to 32.8% and raising best throughput by up to
  12.7% on 8B–60B looped MoE models.
