desc: Tabular foundation model that reapplies one shared twelve-block in-context-learning
  transformer for several passes and scales the last pass's update with a gate computed
  from support-set statistics, pretrained on synthetic contexts that mix related causal
  environments; with four loops it gets the lowest average rank on six classification
  suites, and its regression model ranks first on five suites.
