desc: "Introduces Accordion, a 6B-A0.5B MoE language model that runs each layer of a growing prefix of its middle window twice to offer five depth budgets from one set of weights; after 3.6T tokens the deepest budget lifts a 37-task average from 47.05 to 50.06, and the middle budget keeps 89% of the gain."
