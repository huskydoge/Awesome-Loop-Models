desc: Observes that queries and keys in looped Transformers converge to their final-depth
  values earlier than values do, and introduces Depth-Asynchronous Self-Speculation,
  where shallow drafts read full-depth prefix values; the DAS-Wave variant gives 4.00
  to 6.96 times mean throughput speedup over full-depth decoding on math and code
  workloads.
