desc: Introduces WiFo-R, a wireless channel foundation model whose two shared Transformer blocks loop up to six times over cross-attention channel queries, adding latent tokens each pass; versus untied stacking it cuts parameters from 87.85M to 26.40M and improves OOD prediction NMSE by up to 2.22 dB.
