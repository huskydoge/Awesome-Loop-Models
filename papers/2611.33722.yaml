desc: Introduces FLUENT, a label- and reward-free recipe that distills a looped model's
  final-loop prediction into its early loops, anchors the final loop and trains an
  exit gate, cutting real-robot episode time from 69 s to 31 s while raising success
  from 62.3% to 74.6%.
