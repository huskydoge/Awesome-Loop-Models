desc: Decomposes a state-of-the-art looped MoE recipe against non-revisit controls
  matched on parameters, FLOPs and KV cache, finding that parameter revisit itself
  buys almost nothing; gains come from network shape and residual scale, and a deeper
  untied MoE recovers 90.2% of an extra visit's gain.
