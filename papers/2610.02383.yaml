desc: Pretrains looped language models in which only the first recursion writes a
  KV cache and later recursions read it while keeping a short local window; at 150M
  to 1B parameters the Looped Prediction Transformer and its gated-DeltaNet hybrid
  improve quality rather than losing it, with the hybrid at five recursions lowering
  FineWeb-Edu perplexity by 1.12 to 1.82 versus a same-size standard Transformer while
  using 76 to 79 percent less context memory.
