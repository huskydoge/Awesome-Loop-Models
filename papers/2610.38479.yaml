desc: Decodes QC-MDPC post-quantum codes with a 110K-parameter graph network that
  reuses one set of message MLPs and node GRU cells for up to 12 Tanner-graph iterations,
  stopping once the syndrome is satisfied; on 20 unseen matrices it cuts decoding
  failures by 63.7 percent against Min-Sum at error weight 10.
