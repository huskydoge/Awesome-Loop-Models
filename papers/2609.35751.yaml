desc: Proposes Foil for looped mixture-of-experts models, which halves the expert
  layers while doubling experts per layer and passes, and gives each pass its own
  attention while experts and routers stay shared; at equal parameters and compute,
  Foil lowers pretraining loss over an unflattened looped MoE baseline through 100B
  tokens.
