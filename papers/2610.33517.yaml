desc: Retrofits a pretrained 134M language model to also run its middle blocks twice
  and studies joint losses on both paths; loop-only training worsens single-pass NLL
  by 0.171, while weighting the single-pass loss and distilling from the frozen original
  keep it within tolerance and still improve the looped path.
