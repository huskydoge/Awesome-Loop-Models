desc: Diagnoses hidden-state variance growth and expert-selection collapse as the
  obstacles to looping MoE language models more than twice and proposes LOOM, which
  scales residual updates, re-injects the input embedding at every loop, uses per-loop
  routers and adds a Looping Residual; 100M to 1.7B models scale stably to 9 to 12
  loops, and the 1.7B model at 9 loops lowers perplexity from 9.62 to 7.77.
