desc: Introduces SelfMorph, where a lightweight selector reads a frozen LLM's prompt
  hidden states and picks per input between the plain pass, serially repeating a mid-depth
  layer span, or branching it; on 4B-27B backbones it gives an 8.06 percent mean relative
  gain in distribution and 4.45 percent on unseen benchmarks.
