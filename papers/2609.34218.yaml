desc: Finds that LoRA adapters shared across the loops of a looped language model
  are biased toward late loop positions and proposes Loop Dropout, which randomly
  masks per-loop adapter applications with inverse-survival rescaling, improving mathematical
  reasoning, instruction tuning, and code generation with no extra inference cost.
