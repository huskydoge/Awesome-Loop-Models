desc: Grows a shallow transformer by layer copying during pretraining and spends the
  saved FLOPs on running a shared four-layer middle block twice, matching a dense
  baseline's parameters, tokens and training FLOPs; at 1.3B it lifts the 22-task average
  from 22.99 to 27.52.
