desc: Refines a feed-forward 3D Gaussian Splatting model's own Gaussians inside its forward
  pass with three appearance and five shape steps, each group applying one shared learned
  recurrent update to photometric gradients on the input views; it has the best PSNR and
  SSIM among nine methods on six-view RealEstate10K.
