desc: Restores ultra-high-definition video with one parameter-shared loop that refines
  latent video features using degradation-conditioned low-rank loop embeddings, spatio-
  temporal iterative adaptive normalization and state-aware expert modulation, while
  an input-conditioned depth predictor chooses four or five iterations; with about
  0.884M parameters a single model handles dehazing, deraining, denoising and low-light
  enhancement and attains the best mean PSNR on UHV-4K-AIO.
