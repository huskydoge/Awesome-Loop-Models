desc: Prunes layers from TinyLLaVA's language backbone and loops an 8-layer core with
  a shared linear input-injection adapter, then recovers it with distillation; the
  retrofitted VLM averages 58.13 vs 55.80 for the unpruned model on nine benchmarks
  while storing 23.3 percent fewer language parameters.
