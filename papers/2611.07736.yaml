desc: Introduces RELOAD, which fine-tunes pretrained 0.4B-4B encoders and decoders with a damped,
  weight-tied loop over their middle block and a per-input controller choosing one to four
  passes, lifting encoders by up to 23 points on reasoning chains longer than any seen in
  training.
