desc: Splits a recursive Transformer's core into contiguous blocks that are each looped
  R times before the next, between layer-wise repetition and whole-stack cycling;
  at 360M scale with two loops it reaches 40.20 average accuracy with 157M unique
  parameters versus 39.74 for a 315M vanilla model.
