desc: Introduces MoLR, a LoRA variant that reapplies one shared r-by-r latent transformation
  between the down- and up-projections with a per-token threshold router deciding
  when to stop; with LoRA's parameter count it averages 86.51 on GLUE with RoBERTa-base
  versus 84.65 for LoRA and leads on reasoning and vision tasks.
