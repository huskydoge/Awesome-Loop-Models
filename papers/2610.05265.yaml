desc: Post-training quantization for looped language models that picks one shared
  rotation and channel-scaling configuration for the recurrent core by its final loss
  at the target deployment depth, using progressive full-depth evaluation to cut calibration
  cost; across Ouro, Huginn and Recurrent-Llama at W4A8 and W4A4 it gives the best
  low- bit results, reducing Ouro-1.4B W4A4 LAMBADA perplexity by 36.5 percent relative
  to SpinQuant.
