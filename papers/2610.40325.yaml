desc: Studies looped decoder-only transformers up to 1B parameters and 32 loops, finding
  full-stack looping best at fixed parameters and middle-block looping best under tight
  training FLOPs, with gains that saturate or reverse; loop-specific low-rank adapters
  and normalized Parallel Loop Transformers add quality.
