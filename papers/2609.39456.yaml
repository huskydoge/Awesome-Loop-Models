desc: Fuses two modalities with a pair of learned modules that repeatedly feed their
  outputs into each other and defines the joint embedding as the fixed point of this
  interaction, a special case of a deep equilibrium model computed by damped fixed-point
  iteration truncated at a fixed number of steps with a residual penalty; it outperforms
  concatenation baselines on multimodal classification (largest gain on VQA v2) and
  progressively refines visual grounding.
