desc: Recasts iterative video stereo refinement as a deep equilibrium fixed point solved
  by Broyden iterations until convergence, with a simplified gated update and a warm-started
  hidden state across frames; it reports 0.45 EPE on SceneFlow and a 34 percent runtime
  cut from the cross-frame warm start.
