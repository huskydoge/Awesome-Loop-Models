desc: Proposes RECAP, a CTR model whose cross-network towers share core interaction
  weights across recursive steps and aggregate predictions over inference-time adapter
  routes, combining this with distillation and EMA as parameter-efficient estimator
  scaling to reach state-of-the-art accuracy on standard CTR benchmarks.
