desc: Introduces R2WM, a TRM-style recursive model that reuses a two-block causal-attention
  backbone across nested latent and prediction updates for mmWave beam prediction,
  reaching 0.9597 average normalized beamforming gain vs 0.8629 for an LLM baseline
  with 99.1% fewer parameters.
