desc: Traces how approximations at single steps of the looped reconstructor Deja View
  propagate, finding later steps absorb errors, and turns this into a per-step schedule
  of coarse, KV-pooled and reused steps that beats a latency-matched plain baseline
  by 4.73 AUC@30 points.
