desc: Training-free inference framework for looped Transformers that exploits cross-loop
  redundancy with token-sparse updates, loop-aware sparse attention, and KV-residual
  quantization, reporting lossless accuracy with up to 1.64 times end-to-end speedup
  and 6 times KV-cache reduction on Ouro and Huginn.
