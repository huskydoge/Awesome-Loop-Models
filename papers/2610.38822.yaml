desc: Introduces CopyLoop, a training-free decoder for looped transformers that copies
  multi-token suffixes from earlier context, screens them at a shallow loop depth and
  pipelines surviving positions toward full-depth verification, reaching 2.98-10.70x
  speedups on Ouro, Raven and Huginn base models.
