desc: Shows that in Huginn-0125 and Raven-Llama only late loops need accurate prefix
  keys and values and proposes RIPE, which caches the deepest loop plane plus a recent
  full-depth window; on Huginn a 64-position window uses 11.9% of cache memory, removes
  89% of high-error tail positions, and self-speculation hits 2.58x.
