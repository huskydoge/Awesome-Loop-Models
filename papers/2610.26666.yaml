desc: Adds a persistent intermediate state, updated by the same shared operator that
  nests repeated fast-state updates, to HRM, TRM and URM at matched parameter counts;
  on ARC-AGI-1 under a single-GPU budget the nested variants show no consistent gain,
  and exact solving stays near zero for all models.
