desc: Introduces Dooop, which distills a pretrained diffusion Transformer into a looped
  student by treating each loop as a fixed-point step toward the teacher, so one model
  runs any loop count; an SD3-medium student with 37% of the parameters matches the
  teacher at two loops and 58% of its compute.
