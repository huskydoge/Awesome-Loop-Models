desc: Inserts latent thought tokens that reuse the shared backbone of a Latent Recurrent
  Transformer, whose final hidden state feeds the next token; one thought token recovers
  89 percent of the gain from doubling depth with about 48 percent fewer parameters
  and overtakes a two-loop Transformer at matched training FLOPs.
