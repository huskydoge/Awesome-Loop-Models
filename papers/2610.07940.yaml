desc: 'Cuts the per-loop KV cache of looped language models by keeping exact keys and values only in a sliding window of recent tokens and storing each older token as a compact latent that every loop''s query reads directly; uptrained on frozen Ouro-1.4B and Ouro-2.6B (four loops), it shrinks the cache 10.7x per token, fits 4.0-8.8x more concurrent sequences, speeds decoding up to 7.4x at 16K context, and keeps over 97 percent of the original benchmark accuracy.'
