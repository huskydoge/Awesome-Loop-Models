desc: Mechanistically compares two looped-Transformer recurrence-training schemes
  on polynomial iteration, finite-state composition, and knowledge-graph traversal,
  showing that one updates a state at a fixed readout while the other propagates an
  advancing computational frontier, and that both degrade at depths beyond training
  because readout, progress cues, or state propagation become unreliable.
