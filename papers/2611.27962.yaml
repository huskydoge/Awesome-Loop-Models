desc: Introduces Model Carving, which gives every sublayer application its own learned
  scalar gate, one per loop in looped Transformers, and removes closed sublayers during
  pretraining; a carved 1.3B four-loop model drops 45 of 192 sublayer applications
  and still beats its full-depth looped baseline (0.683 vs 0.704 bpb).
