desc: Shows that entering a looped LM at its final K of T passes over a T-pass KV
  cache beats matched early exit after entry fine-tuning, and fuses late-pass blocks,
  pipelined cache completion, and shared-GEMM Wake verification in one CUDA graph
  for up to 5.23x (Ouro-2.6B) and 8.42x (Huginn-3.5B) greedy-exact speedups.
