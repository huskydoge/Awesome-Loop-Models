desc: Shows that quantization error injected early in a recurrent-depth language model's
  loop is damped by later iterations and runs the first 24 of Huginn-0125's 32 recurrent
  steps in FP8 and the last 8 in BF16, keeping prefill NLL within 0.0001 of BF16 at
  4K context with up to 1.16x H100 speedup and no retraining.
