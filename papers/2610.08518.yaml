desc: Replaces the fixed local perception of a neural cellular automaton with deformable
  convolutions whose offsets are predicted from the current cell state, so the same
  learned update rule, iterated over many steps, can adapt its receptive field across
  grid positions and steps; with about 165-256k parameters it solves 87.8 percent
  of hard array Sudokus (vs 78.2 for a 3x3 NCA) and finds valid optimal maze paths
  94.2 percent of the time, above reported HRM and TRM results.
