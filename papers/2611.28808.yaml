desc: Shows with tuned lenses and probes that stored facts in looped transformers
  become readable earlier across loops than in untied models of equal unrolled depth,
  that heavier memorization delays retrieval, and that patching an entity subspace
  redirects multi-hop answers in 79.07–98.57% of cases.
