desc: Adds a lightweight drafter that predicts several future tokens from early-loop
  states of a frozen looped LM and uses intermediate-loop feedback to pause wrong
  branches in a depth-pipelined batch, reaching up to 7.82x lossless decoding speedup
  over autoregressive decoding on Ouro and Raven models.
