desc: Shows that recurrent algorithmic reasoners that fit every BFS hint can prematurely
  flood deep graphs through hidden-state drift on tail-distribution inputs; detaching
  state between steps removes the flood (0 of 23 seeds versus 6 of 23 under BPTT)
  but not for sum-aggregation or residual processors.
