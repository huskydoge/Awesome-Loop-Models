desc: Turns each imagined transition of a JEPA world-model planner into a weight-tied
  recurrent cell with a learned continue head that decides per candidate and rollout
  step whether to run another update; across five visual-control settings it improves
  or matches the best fixed-depth planner while averaging only 1.00 to 1.26 updates
  per transition, with extra computation concentrated at contact events.
