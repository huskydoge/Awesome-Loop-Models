desc: Introduces Spatial-TRM, an 11.2M-trainable-parameter weight-tied two-state recursive
  reasoner over frozen DINOv3 vision-language features with a convex region decoder;
  it reaches 29.51 percent context accuracy on RoboSpatial-Home, 9.02 points above
  a parameter-matched single-step model.
