desc: Introduces loop-wise contrastive decoding, which contrasts predictions from
  successive applications of a shared recurrent language-model block to suppress
  premature answers, improving reasoning accuracy by 1.06 to 6.71 percentage points
  while retaining roughly 0.98 to 0.99 times baseline throughput.
