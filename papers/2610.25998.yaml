desc: Constructs constant-bit-size looped Transformers that apply one shared decoder
  block L times per generated token, interpolating between chain-of-thought and latent
  thought; they simulate time-t, space-s Turing machines with both the context window
  and the number of generated tokens cut by a factor of L.
