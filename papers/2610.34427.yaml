desc: Makes GRPO on the looped Ouro-1.4B fast and exact by batching deferred deep
  loops in rollouts and replaying the rollout's own schedule for learner log-probabilities;
  the replay matches rollouts bit for bit in all 195 tested cells, deferral lifts
  rollout throughput 1.47-1.56x, and two-node updates run 2.71x faster.
