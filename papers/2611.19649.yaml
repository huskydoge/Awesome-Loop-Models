desc: Introduces LoopFill, a training-free decoder for looped LLMs that merges suffix-lookup drafts and shallow-loop predictions into one draft tree processed by the shared block in one batch, reaching 5.85x greedy speedup on Ouro-2.6B and 5.13x on Huginn-3.5B, 40% and 25% above LoopAhead.
