desc: Introduces LoopVQ, which vector-quantizes the KV cache of looped transformers
  by coding channels of several loop steps jointly and fine-tuning codebooks against
  the BF16 model; at 0.5 bits it keeps Ouro-1.4B at 68.29 average versus 43.62 for
  TaSQ and raises SGLang peak throughput up to 6.1x.
