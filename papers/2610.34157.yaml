desc: Introduces LoopGR, a generative recommender that alternates a shared decoder
  with a shared lightweight context updater in nested cycles per generated item and
  distills low-budget students along the recurrent trajectory; it outperforms strong
  baselines on Amazon and industrial data with up to 52% fewer parameters.
