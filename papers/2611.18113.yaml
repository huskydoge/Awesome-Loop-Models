desc: Introduces Concertina, which folds each group of adjacent pretrained decoder
  layers into one shared block looped N times with SVD-initialized per-step LoRA mixed
  by a per-token gate; a 2.27B fold of Qwen3-4B distilled on 22B tokens keeps 84%
  of the teacher and beats Qwen3-1.7B on six of eight benchmarks.
