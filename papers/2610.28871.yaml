desc: Measures exactly, from one backward pass, how much weight gradient truncated backprop drops on nine looped language models; the lost share barely changes from 32 to 64 loops, keeping two of Ouro's four loops loses 81% of the final output's gradient, and the loss falls by 0.07-0.22 during fine-tuning.
