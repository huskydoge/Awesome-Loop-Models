desc: "Gives compute-efficient recipes for looped language models: a from-scratch pipeline that cuts training from Ouro's 7.7T to 310B tokens using mid-training, learning-rate warmup and stronger exit-gate regularization, yielding a 1.4B LoopLM that beats a parameter-matched dense model on all 12 benchmarks, plus a minimal recipe that converts Qwen3-1.7B-Base into a looped model with one learned input-mixing scalar and a smoothed exit loss."
