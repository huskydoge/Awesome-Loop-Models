desc: Ties repeated MBConv blocks of a trained EfficientNet-B0 to shared kernels with
  per-pass BatchNorm; alternating two templates in Stage 6 ([B1, A, B, A]) cuts parameters
  by 10.9% and reaches 70.92% ImageNet accuracy after one epoch, 1.84 points below
  the unshared control, while single-template tying trails by 6.66.
