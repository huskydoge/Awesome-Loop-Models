desc: Inserts a small recurrent latent block between the audio encoder and language
  model of large audio language models; the block (question-guided cross-attention,
  multi-scale local self-attention and a feed-forward update, with weights shared
  across iterations plus an iteration embedding) refines audio features up to eight
  times until a question-conditioned halting unit stops it, adding under 3 percent
  parameters and raising average accuracy on MMSU, MMAU-Pro and MMAR by 2.9-3.8 points
  across Qwen2.5-Omni, Kimi-Audio and MiMo-Audio.
