desc: Argues that once a looped language model's recurrent states approach fixed points,
  the endpoint can replace the trajectory, enabling truncated backpropagation, terminal
  KV sharing, distilled prefill up to 1.79x faster, and RL updates from saved rollout
  states about 2x faster; it shapes those fixed points with a depth prior learned
  from prediction feedback plus an entropy term and with orthogonal input injection,
  and at 1.6B parameters the learned prior with a 3x smaller KV cache matches the
  downstream average of fixed-depth training with the full cache.
