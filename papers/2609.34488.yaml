desc: Shows that pretrained looped RL policies specialize to their trained recurrent depth
  and proposes FlexLoop, a post-training method using adjacent-depth policy distillation so
  decisions stay reliable at shallower depths and can stop per state via recurrent-depth consistency,
  evaluated on 30 long-horizon goal-conditioned environments.
