desc: 'Turns the pretrained looped language model Ouro into a typed decision model
  that returns option probabilities without generating text: LoRA adapters and a small
  readout read the answer after every pass of the 24-layer stack and train each loop
  with a proper scoring rule, so one model serves budgets from one to eight loops;
  on 10,027 decisions from 59 sources it reaches 72.0 percent, 13.5 points above a
  non-looped model of the same shape trained with the same recipe, and loops extend
  solvable depth beyond training.'
