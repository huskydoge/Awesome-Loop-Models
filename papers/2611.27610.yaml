desc: Closes a predictive-coding network into a loop of shared learned maps whose
  energy equilibrium is an equivalent DEQ's fixed point, trained by local equilibrium
  propagation; it reaches 93.54% on CIFAR-10 and, with a 105k-parameter recursive
  variant, 99.3% on Sudoku-hard over 1,024 relabelled views.
