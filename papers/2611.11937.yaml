desc: Casts attention-style layers as sums over witness families read at a temperature, proving that L pair layers, or one layer looped L times, reach exactly 2^L-1 search steps; one looped 186K-parameter block matches or beats the 73M-parameter FloydNet on 9 of 12 CLRS-30 graph tasks.
