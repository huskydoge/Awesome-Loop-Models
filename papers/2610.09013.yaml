desc: Makes early exit in Ouro-style looped language models actually save compute with
  Ragged KV, where later tokens reuse each earlier token's exit-depth KV entries instead
  of forcing all loops, cutting FLOPs and KV memory by up to 30 percent at full-depth
  quality; it also replaces Ouro's per-token exit prior with a batch-level prior so tokens
  exit at genuinely different depths.
