desc: Introduces Looped Actor, a transformer policy that repeatedly applies a shared
  block to refine a latent toward a fixed point with state-dependent loop counts;
  across 22 tasks in six online and offline RL environments it matches or exceeds
  an untied baseline with 16x more parameters, with largest gains where planning is
  needed.
