desc: Replaces direct feedback in a looped Transformer with a rectified-flow-style
  interpolation toward each loop's endpoint prediction, keeping state norms bounded;
  at 278M it lowers Pile perplexity at matched depth and, trained at 8 loops and run
  at 32, reaches 17.72 perplexity versus 57.72.
