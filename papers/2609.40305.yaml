desc: Loops a shared middle group of MMDiT blocks several times inside each denoising
  step of a text-to-image model and stabilizes the loops with deep supervision across
  loop depths and self-modulating attention; under matched-parameter and matched-compute
  settings Looped-DiT beats non-looped baselines, and a 260M looped model surpasses
  a 6.5x larger model on several benchmarks with 4.9x lower inference compute.
