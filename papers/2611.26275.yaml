desc: Restructures LLaDA into a Prelude-Loop-Coda model that reruns shared layers
  16-21 with Parcae-style input injection inside each denoising step before tokens
  are committed; with multi-depth SFT, two extra loops lift GSM8K from 75.0% to 79.2%,
  and no compared accelerator beats it on both accuracy and loop-adjusted TPF.
