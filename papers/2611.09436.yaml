desc: Appends a shared CRF, modern Hopfield or ConvGRU refinement operator, re-anchored to the backbone logits each step, to a U-Net and iterates it at test time; with under 1.5% extra parameters it adds up to 1.4 Dice points on clean data and up to 17 under noise, stable beyond the training horizon.
