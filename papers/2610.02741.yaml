desc: "Gives the first systematic evaluation of chain-of-thought monitorability in looped language models on eight MonitorBench tasks, varying Ouro loop depth and comparing against non-looped models matched by parameters, layer count or effective depth; deeper loops reduce monitorability on some cue-answer stress tests, but looped models are not systematically less monitorable than matched non-looped models."
