desc: "Introduces LoopFold, which uses a learned predictor to start later loops of a looped transformer before earlier ones finish and a corrector to refine them; 1.4B models rise from 53.41% to 56.38% average zero-shot accuracy as depth grows, with 46% lower latency than a nine-loop vanilla model."
