desc: 'Shows that extra loop steps stay usable because training and inference loops
  agree, not because of loop-boundary normalisation: removing Ouro''s between-step
  norm drops it to zero accuracy at its trained budget, yet 19M models trained without
  it extrapolate better (0.932 vs 0.584 at 8x budget).'
