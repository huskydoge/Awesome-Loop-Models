desc: "Introduces FoldCache, which keeps an exact prefill but lets groups of recurrent invocations of the same weight-tied module share that group's final visual KV during decoding; on LoopVL it stores about half the prefix KV at full-cache accuracy and fits up to 1.7x larger batches (2.6x with FoldCache-Lite)."
