desc: Introduces Floodgates, lossless self-speculative decoding in which one loop
  of a looped LM drafts a block of mask tokens in parallel via LoRA while reading
  the final-loop prefix cache, reaching up to 7.5x speedup across seven Ouro, Huginn
  and retrofitted looped models.
