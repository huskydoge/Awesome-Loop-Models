desc: Proposes LoopTrack, a visual object tracker that repeatedly applies a shared set of
  Transformer blocks for template-search interaction instead of stacking separately parameterized
  blocks, adding target-aware looping and a gated cross-frame target memory to reduce parameters
  while keeping multiple rounds of feature interaction.
