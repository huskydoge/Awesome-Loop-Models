desc: 'Tests why compressed looped models collapse across more than 30 models from five families (HRM/TRM puzzle reasoners, recurrent convnets, DEQs, looped language models, diffusion samplers) and finds that rounding error accumulates only for loops that never settle; for settling loops a fixed weight error just shifts the fixed point, so a controller that stops at the halting head and finishes with a few 8-bit loops lifts compressed Sudoku-Extreme models from 61.1 to 75.8 at under a third of the weight traffic.'
