desc: Pretrains looped language models up to 1.3B with halting heads and finds that
  mixture-loss heads still run 7.6-7.9 of 8 iterations, while early-stopping per-step
  heads lose most of their 0.02 BPB lead once batched passes run until the slowest
  token stops; proposes a pre-training test that bounds a head's gain.
