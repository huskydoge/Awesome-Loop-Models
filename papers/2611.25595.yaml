desc: "Introduces LoopedWAM, a world action model whose video and action experts each store 12 blocks and loop a shared 6-block core to 30 executed layers, with decoupled video/action depths and elastic self-distillation; the 0.58B policy reaches 96.1% on LIBERO and 91.9% on RoboTwin 2.0."
