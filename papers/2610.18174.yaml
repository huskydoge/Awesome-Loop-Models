desc: Shows that slowly decaying oscillatory modes rate-limit convergence of recurrent
  reasoners and introduces QRR, a gauge-equivariant looped block that halts on a quotient-
  space fixed-point residual, reaching 97.9 percent on Sudoku-Extreme with a median
  halt step of 27 versus 122 for FPRM.
