desc: Unrolls accelerated MRI reconstruction with one shared Restormer block that
  receives data-consistency inputs and latent images at every iteration, beating
  PromptMR+ in PSNR and SSIM on brain, knee, heart and carotid data with 10.3M versus
  92.9M parameters.
