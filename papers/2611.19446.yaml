desc: Studies how to cut the per-iteration KV cache of depth-recurrent language models,
  comparing looped hybrids with mLSTM or Gated DeltaNet mixers, a Parcae-style workspace,
  and recurrent KV replay; replaying KV from every third of six loops scores 18.71
  CORE against 18.96 with separate caches.
