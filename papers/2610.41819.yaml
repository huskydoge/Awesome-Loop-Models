desc: Trains a TabPFN-style looped transformer whose shared three-block stack runs up
  to six times, with early-exit supervision at a randomly sampled depth plus self-distillation;
  one 6.9M model serves every loop budget, staying within 0.27 AUC-ROC points of a 12-layer
  TabPFN at 25% fewer FLOPs.
