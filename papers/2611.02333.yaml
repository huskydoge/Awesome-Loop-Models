desc: Compares a trained stability probe with Ouro-1.4B's native exit gate for per-question
  halting over four loops in pre-registered tests, finding that the probe saves more
  loop budget under a bootstrap-screened 1 pp loss rule (+0.053 macro saving) but
  loses under a point-only rule (-0.022).
