desc: Adds a persistent hidden state to a timestep-free denoiser built from a looped
  weight-shared Transformer or convolutional block, using diffusion only as a training
  curriculum, and reaches 99.90 percent exact solve on Sudoku-Extreme and 98.93 percent
  on Maze-Unique with accuracy rising past trained depths.
