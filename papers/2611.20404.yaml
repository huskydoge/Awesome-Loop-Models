desc: Compares a latent-feedback Transformer, which feeds each token's top-layer state
  into the next token's input, with a same-size Transformer given equal compute or
  epochs from 60M to 778M parameters; feedback saves up to 48% of compute and 47%
  of unique data once data per parameter is ample.
