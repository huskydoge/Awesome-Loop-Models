desc: Releases a 4B nGPT language model with a shared 40-layer recurrent block between
  input and output blocks, trained on 6T tokens with sampled loop counts and RLVR
  loop curricula; its 12-benchmark average rises from 35.17 at one loop to 40.60 at
  four, with KV cached only from the last loop.
