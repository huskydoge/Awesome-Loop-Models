desc: Shows that failed Tiny Recursive Model trajectories carry their failure in the
  answer state and introduces Gated Answer Resampling, which restarts halting-head-rejected
  puzzles with a resampled answer state and lifts TRM from 85.9 to 99.4 percent on
  Sudoku- Extreme.
