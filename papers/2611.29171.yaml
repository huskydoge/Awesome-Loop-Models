desc: Shows on a swap-based state-tracking task that weight-tied recurrent Transformers
  length-generalize only with atomic operation tokens and no absolute positional encoding,
  reaching 90.6% exact match on 11–19 swaps vs 28.1% for a compute-matched untied
  model.
