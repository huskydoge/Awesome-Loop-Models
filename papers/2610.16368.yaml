desc: Introduces LoopQuant, a post-training quantization method for looped language
  models with loop-shared transforms, loop-wise activation precision allocation and
  per-loop calibration; at W4A4 on Ouro-2.6B it beats W4A8 baselines while cutting
  memory by 65.3 percent and speeding decoding 1.7x.
