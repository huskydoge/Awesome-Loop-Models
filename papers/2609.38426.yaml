desc: 'Extends looped Transformers to vision-language models: LoopVL reuses two 16-layer
  L/H Transformer stacks under a Module-Loop and Model-Loop schedule, executing 128
  layer calls from 32 unique layers, and after language pretraining, multimodal training
  and post-training it outperforms similarly sized and larger non-recurrent VLMs on
  multimodal understanding and visual reasoning benchmarks.'
