desc: Builds CLIP encoders from N transformer blocks applied M times at ViT-B/16 depth
  and trains them by distillation on CC3M+CC12M; one block looped 12 times halves
  parameters and reaches 56.7% ImageNet zero-shot against 72.5% for the distilled
  untied ViT-B, and output-level losses beat feature matching.
