desc: KV cache quantization for looped transformers that exploits the similarity of
  KV states across loops, storing the final-loop KV as an anchor and the other loops
  as 2-bit residuals with least-squares scaling, rotation and loop-wise mixed precision;
  on Ouro-1.4B and Huginn-3.5B it stays near BF16 accuracy while cutting KV storage
  by 80.7 percent and raises decode throughput up to 2.73x.
