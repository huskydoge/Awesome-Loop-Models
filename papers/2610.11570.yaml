desc: InfiLoop replaces carry-last state passing in TRM-style looped reasoners with
  a learned, decaying attention residual over all past iterates that runs as an exact
  O(d) streaming recurrence, reaching 97.9 percent on Sudoku-Extreme and 13.6 percent
  pass@2 on ARC-AGI-2 with 7M parameters and still improving past 20,000 layer evaluations.
