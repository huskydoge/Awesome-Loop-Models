desc: Diagnoses two failure modes of post-training quantization for looped Transformers,
  feedback exposure at non-residual loop-entry layers and calibration blindness from
  step-0-only GPTQ Hessians, and shows that accumulating the Hessian across recurrence
  steps beats one-step GPTQ and round-to-nearest on nine checkpoints from seven looped
  architectures, recovering bf16-level accuracy on Huginn.
