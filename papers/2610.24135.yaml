desc: Probes weight-tied Transformers on multi-hop permutation traversal and finds
  the loop advances through intermediate hops in a staircase across iterations; a
  four-layer block looped eight times solves the task in 5 of 5 seeds, while an identically
  trained untied 32-layer model solves it in none.
