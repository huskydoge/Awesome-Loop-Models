desc: Analyzes the hidden channels of a roughly 9,800-parameter neural cellular automaton
  whose learned update rule is reused over recurrent steps, finding orthogonal,
  scale-invariant topological features that transfer across few-shot and scale-varied
  MNIST tasks.
