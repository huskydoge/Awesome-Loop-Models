desc: 'Introduces QART, a visual tokenizer whose shared three-layer Transformer refines query-conditioned slots over recurrent rounds, adding slots until query-relevant features are reconstructed and then halting; it reaches 81.96 percent on Visual7W and 76.37 percent on VQAv2 with about 29 visual tokens.'
