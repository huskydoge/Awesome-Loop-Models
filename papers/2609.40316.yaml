desc: Proposes Loop Scaling Laws that jointly model recurrence, MoE sparsity, model
  size and data through a bounded, sparsity-conditional effective-parameter gain from
  looping, predicting held-out loss better than linear or power-law alternatives;
  at matched training compute on trillion-token runs, a looped MoE with law-derived
  recurrence matches a roughly 2x larger non-looped MoE on reasoning benchmarks.
