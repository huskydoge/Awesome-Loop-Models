desc: Painter-Thinker couples a TRM-style recursive reasoner, which refines a latent
  state inside every denoising step, to a frozen diffusion model through ControlNet adapters
  and trains it only with the reconstruction loss; with 10M parameters it solves 92.5
  percent of hard and 71.2 percent of extreme MNIST Sudoku puzzles, versus 75 and 4.1
  percent for the prior best, and also helps on mazes, Queens and CLEVR relations.
