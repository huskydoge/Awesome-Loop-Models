desc: Adapts tiny recursive models to combinatorial optimization with a graph-aware network
  that iterates a latent state under adaptive halting and scales both recursion depth and
  parallel sampling, beating diffusion-based solvers on TSP from 500 to 10,000 cities at lower
  cost and exploring self-relabeling as a training signal.
