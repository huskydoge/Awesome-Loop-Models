desc: Analyzes the recurrent tick map of an ImageNet Continuous Thought Machine, showing
  each tick is an attracting but strongly non-normal map whose state trails a moving
  fixed point by one tick, and that shuffling attention queries across images costs only
  7 percent of accuracy.
