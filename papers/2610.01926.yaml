desc: >-
  Loops a shared stack of audio spectrogram transformer blocks but, after the first full
  pass, updates only the class token against cached audio keys and values, so extra
  passes are nearly free; on AudioSet a ten-pass model reaches 0.345 mAP, 2.1 percent
  relative above a twelve-layer sequential transformer with 49.4 percent fewer
  parameters and 42 percent fewer MACs, while full-token recurrence with the same blocks
  degrades with depth.
