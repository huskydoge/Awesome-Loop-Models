desc: "Proposes LoopCD, a training-free contrastive decoding method that contrasts a looped Transformer's final-loop prediction with an earlier recurrent pass in logit or hidden-state space; across four looped model families it raises Ouro-2.6B-Thinking AIME 2024 pass@1 from 61.88 to 73.33 percent and lets models halve their loops while matching full-depth baselines, cutting forward FLOPs by 22.5 to 48.2 percent."
