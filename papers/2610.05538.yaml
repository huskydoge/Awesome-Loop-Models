desc: Splits a Diffusion Transformer into a prelude, a depth-conditioned shared recurrent
  core and a prediction head, and supervises every loop with a point on a straight
  path from the model's initial estimate to the flow-matching target indexed by a
  continuous depth coordinate, so the core can be looped far beyond its training depth;
  on ImageNet 256x256 LiFT-L/2 reaches an FID 3.34 lower than a dense DiT-XL/2 with
  about 60 percent fewer parameters and 52 percent fewer inference FLOPs.
