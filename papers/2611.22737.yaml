desc: Trains each pass of a TRM-style looped refiner toward the correct answer nearest
  its own input draft instead of one stored answer, making every answer a fixed point;
  a 1.7M-parameter model solves 98.8% of multi-answer Sudoku puzzles versus 2.5% with
  the standard target.
