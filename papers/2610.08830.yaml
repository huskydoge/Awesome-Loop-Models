desc: Brings Mixture-of-Recursions to multimodal LLMs by replacing grouped middle
  layers of a Phi-2 backbone with shared recursive blocks whose routers pick a recursion
  depth per visual or text token, trained with a three-stage MoR-Tuning recipe and
  an entropy routing loss; against LLaVA-1.5-7B it cuts inference TFLOPs by 86.6 percent
  on average while staying competitive on nine vision-language benchmarks.
