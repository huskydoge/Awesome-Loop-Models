desc: Introduces LoopICL, a tabular in-context-learning foundation model built from
  a single transformer block unrolled with cell and row streams and a learned exit
  gate; it matches TabICLv2 on TabArena and TALENT at equal FLOPs with nearly 90%
  fewer parameters and lets users trade inference cost for accuracy.
