desc: Fits an effective-parameter scaling law over nearly 600 looped-Transformer runs
  varying forward and backpropagated loops; full BPTT through fewer loops beats truncated
  BPTT at matched compute, and two fully trained loops beat the compute-optimal non-looped
  model with 27% fewer parameters at 8% more compute.
