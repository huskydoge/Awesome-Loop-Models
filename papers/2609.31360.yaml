desc: Reproduces program-of-layers (PoLar) search across five LLMs, confirming that
  inputs benefit from skipping and repeating contiguous layer blocks within one forward
  pass, that harder questions need more layer repeats, and that a few generic programs
  cover most questions, while failing to replicate the learned router's single-shot
  gains.
