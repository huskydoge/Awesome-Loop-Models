desc: "Introduces the Random Recursive Model, which keeps a small pool of learned layers and, at each of T recursive steps, samples one layer with replacement, so depth can vary at inference and Monte Carlo inference becomes possible; on CIFAR-10, Sudoku, Zebra, Sudoku-Extreme, Maze-Hard and ARC-AGI-1 it matches or beats fixed-order and HRM/TRM baselines, often with 50 to 75 percent fewer parameters."
