desc: Places frozen paragraph embeddings of a legal act on a 2D lattice and consolidates
  them with a masked neural cellular automaton that applies one shared local update
  for eight steps, reaching state-of-the-art ROUGE across all 24 EUR-Lex-Sum languages
  with a 1.8M-parameter consolidator.
