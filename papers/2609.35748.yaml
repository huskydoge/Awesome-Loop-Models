desc: Measures test-time scaling of looped Transformers as accuracy gain per doubling of decoding
  FLOPs and proposes TaH2, which post-trains a looped backbone with an iteration decider supervised
  by lookahead depth labels so only tokens that benefit get extra iterations, improving the
  AIME accuracy-compute slope by 53 percent over the non-looped baseline.
