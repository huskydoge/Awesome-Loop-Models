desc: Elastic Latent Recurrence trains looped language models without a one-loop tax,
  using a gated state update with a learned step size, mixed loop counts within each
  update, and loop-index and budget conditioning; on 4B and 30B-A3B hybrid models
  one loop matches the non-recurrent baseline and four loops add 4.75 to 7.25 points.
