desc: Diagnoses KV-cache quantization error across the per-loop KV planes of Ouro-1.4B
  and Huginn, finding that values hold 94% of diagonal Fisher mass while keys cause 89%
  of measured KL, and that a per-cell bit allocator lowers one-step KL at 25-48% of BF16
  bytes.
