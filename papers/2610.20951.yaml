desc: Fine-tunes natively looped LMs into single-pass multiple-choice decision models
  that read the options after every loop step, with a learned stopper choosing depth
  per question; a 2.6B LEV rises from 63.2 to 76.2 percent on JevBench from depth
  1 to 4 and on-demand depth saves 15 to 24 percent of compute.
