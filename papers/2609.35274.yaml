desc: Proves that allowing multiple equilibria lets one weight-tied recurrent message-passing
  GNN represent set-valued permutation-equivariant maps, with different initializations converging
  to different valid solutions, and learns such dynamics without solution labels on Ising
  ground states, protein module detection, and chemical reaction steady states.
