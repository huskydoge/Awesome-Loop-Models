desc: >
  Re-runs a contiguous block of middle layers in a frozen pretrained LLM with
  no training, locating the block by sweeping every (i, j) configuration into
  a benchmark heatmap; duplicating seven layers of Qwen2-72B produced the #1
  Open LLM Leaderboard model, and the heatmaps suggest reasoning is organised
  into multi-layer circuits rather than interchangeable refinement steps.

