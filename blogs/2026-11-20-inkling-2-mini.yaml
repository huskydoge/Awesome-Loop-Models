desc: >
  Release post for Inkling 2 Mini, an open-weight 26.4B-total MoE that stores 24
  layers but runs its two middle six-layer blocks three times per token (48 layer
  applications), and reports that looping was over 50% more compute-efficient
  than a non-looped model on its scaling ladder.

