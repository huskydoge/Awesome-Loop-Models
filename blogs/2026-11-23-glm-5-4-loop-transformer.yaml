desc: >
  Announces GLM-5.4, Z.ai's first looped flagship, a roughly 750B-parameter model
  continued-trained from GLM-5 that runs 28 weight-shared layers twice per forward
  pass with per-token write-back gates and a hybrid KV cache, which Z.ai calls
  comparable to 2T-3T-parameter models; benchmarks and open weights are not yet released.

