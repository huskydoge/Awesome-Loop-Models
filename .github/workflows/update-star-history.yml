# Generate repository-owned star history charts without exposing a personal token.
name: Update star history

on:
  push:
    paths:
      - ".github/workflows/update-star-history.yml"
  schedule:
    - cron: "23 6 * * *"
  watch:
    types: [started]
  workflow_dispatch:

concurrency:
  group: update-star-history
  cancel-in-progress: true

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate star history charts
        uses: narayann7/star-history-action@a68d8f9d67ca20d55b682a264e69152dcf326e9c # v1.0.5
        with:
          repos: ${{ github.repository }}
          output-dir: assets/star-history
          themes: light,dark
          type: Date
          update-readme: false
